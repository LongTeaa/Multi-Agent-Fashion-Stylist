[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-fashion-stylist-backend"
version = "0.1.0"
description = "FastAPI backend for Multi-Agent Fashion Stylist"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.136.0",
  "minio==7.2.20",
  "pydantic==2.13.1",
  "pydantic-settings==2.15.0",
  "sqlmodel==0.0.42",
  "uvicorn[standard]>=0.24.0",
]

[project.optional-dependencies]
dev = [
  "alembic==1.19.2",
  "httpx>=0.27.0",
  "pytest==9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
